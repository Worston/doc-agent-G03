# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

ingest:    {raw_dir: "data/raw", doc_id: "hkb", page_glob: "*.png"}   # Stage 1 — page images built by scripts/get_data.sh
# Stage 1 — classical cleanup (speciality E1, degraded scans). Writes data/interim/<page_id>.png.
preprocess:
  enabled: true
  out_dir: "data/interim"
  # Values below are measured on the 40-page verified oracle (Tesseract CER): raw .0914,
  # deskew+median .0797, no median .0885, +sauvola .0911, +otsu .0799. See preprocess.py.
  deskew:    {max_angle: 3.0, coarse_step: 0.5, fine_step: 0.05, min_angle: 0.05}  # held-out pages skew <=0.55 deg but end-matter reaches ~2 deg, so keep headroom
  denoise:   {median_ksize: 3}                         # worth 0.009 CER
  binarize:  {method: "none", window: 41, k: 0.2}      # off: Tesseract binarizes internally and TrOCR wants continuous tone; sauvola / otsu / adaptive available
  despeckle: {min_area: 12}                            # only applies when binarizing; a 10 pt full stop is ~70 px at 300 DPI, so punctuation survives
  workers: 0                                           # 0 = cpu_count - 1
# Off: the generative enhancer is the BONUS item and Enhancer.apply() is still a stub, so
# leaving this true makes build_knowledge_base() die at Stage 1 with NotImplementedError.
enhance:   {enabled: false, model: "unet_small", type: "diffusion"}   # or "vae" / "none"
# Stage 2 — segmentation + reading order (speciality E2). Recursive XY-cut, not a learned
# detector: layoutparser/detectron2 do not install on Apple Silicon, so "detectron2:layout"
# was never runnable here. Measured on the 40 verified pages: CER 0.0797 -> 0.0272 overall,
# 0.1628 -> 0.0259 on mixed-layout pages; column structure 33/40 vs 15/40 for A1's heuristic.
layout:
  model: "xycut"
  min_col_gap: 0.025      # fraction of page width; > a word space (~20 px), < the 70-98 px gutter
  min_row_gap: 0.008      # floor only — the working threshold comes from each region's own leading
  row_gap_factor: 1.6     # a gap this much bigger than normal leading is a structural break
  min_block: 0.010
  noise: 0.004
  border: 0.015           # ignore scan shadow / book-edge marks at the page edges
  heading_lines: 1.8
  text_rhythm: 0.10       # blank-row fraction below which a tall block is a picture, not prose
  max_depth: 12
# Stage 3 — OCR. "tesseract" | any HuggingFace id | a local fine-tuned dir.
ocr:
  model: "tesseract"
  finetune: true          # use ocr_train.out_dir when it is on disk; ignored for tesseract
  psm: 6                  # a layout region is a uniform block, so Tesseract must not re-segment
  source_dir: "data/interim"   # bboxes from Stage 2 are in the Stage 1 frame, not data/raw
  line_gap: 0.3           # 0.5 fused paragraphs into single "lines" for the line recogniser
# Fine-tune data + hyperparameters. Labels are the Internet Archive ABBYY text layer, which
# is a NOISY TEACHER (~0.048 CER per line after re-ordering), not ground truth: this is
# distillation. The 40 verified pages and every TEST section are excluded — see datamodule.
ocr_train:
  # "small" (62M), not "base" (334M), for a measured reason: no usable GPU here. One base
  # step (batch 8) is 6-12 s on CPU and ~200 s on MPS even after the graph shapes stop
  # changing, so 2 epochs would cost ~5 h / ~100 h. Small is 1.2 s/step -> ~20 min/epoch.
  base_model: "microsoft/trocr-small-printed"
  out_dir: "models/trocr-hkb"
  epochs: 3
  batch_size: 8
  # 160-step probe, mean loss over the last 40: 5e-6 -> 5.76, 5e-5 -> 2.65, 2e-4 -> 4.47.
  # 5e-6 is the rate for the 334M model; on 62M it barely moves and the recogniser drops
  # most of the words in a line (page CER 0.63).
  lr: 5.0e-5
  warmup_steps: 200
  weight_decay: 0.01
  grad_clip: 1.0
  max_target_length: 64   # a printed line of this book is ~60 characters
  limit_val_batches: 50   # full val is 2k lines; 50 batches is enough to steer checkpointing
embed:     {model: "sentence-transformers/all-MiniLM-L6-v2", dim: 384}
# Stage 4. chunk_tokens is counted in WORDPIECES: this corpus runs 1.32 pieces per word, so a
# 256-*word* window would be ~338 pieces and the encoder would truncate every chunk's tail.
# type: "faiss:hnsw" and "faiss:flat" still work, but faiss and torch each ship their own
# libomp and the second to load aborts the process (OMP: Error #15 -> SIGSEGV) unless
# OMP_NUM_THREADS=1, which also single-threads training. It buys nothing at this size anyway:
# 0.004 ms/query for numpy exact vs 0.009 flat / 0.012 hnsw, recall@10 = 1.000 for all three.
index:     {type: "numpy:flat", out_dir: "data/index", chunk_tokens: 256, overlap: 32}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
