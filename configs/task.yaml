# Stage 0 — problem statement (one per group). Set in A1, carried into A2 unchanged.
project_name: "CulinaryHeritageQA"
group_id: "03"
domain: "historical-cookbook-culinary-heritage"
data_speciality: "multi-column"      # primary; secondary condition: degraded/dirty scans
primary_nfr: "calibrated"
nfr_target: "ECE <= 0.05 on the task suite (10 equal-mass bins)"   # our committed target
success_metric: "groundedness >= 0.90"   # A1 headline answer-quality metric — DO NOT CHANGE
corpus:
  min_pages: 300
  min_words: 60000
  source_url: "https://archive.org/details/homekeepingbook00brow"
  license: "public-domain"

# EDA parameters. A1 committed that these live here, NOT in notebook cells, so that
# notebooks/eda.ipynb re-derives every corpus number from a single declared source.
eda:
  source_pdf: "data/interim/homekeepingbook00brow.pdf"   # placed by scripts/get_data.sh
  content_min_words: 80          # below this a page is sparse front-matter / plate / blank memo
  two_column_max_cross_frac: 0.012   # <1.2% of word boxes straddling the centre-line => two-column
  # Pages A1 names as layout exemplars; the notebook re-checks them rather than trusting A1.
  exemplar_two_column: [350]
  exemplar_single_column: [201, 301]

# Numbers as printed in the submitted A1 form. Kept verbatim for consistency (the A2 rubric
# awards Section 1 marks for matching A1); the notebook reports what it actually measures and
# flags any delta rather than editing these.
a1_reported:
  total_pages: 624
  content_pages: 506
  sparse_pages: 118
  total_words: 318259
  median_content_words: 626
  max_content_words: 1064
  two_column_pages: 167
  two_column_pct: 33.0
